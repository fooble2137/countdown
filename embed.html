<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />

    <link href="font/font.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <script src="embed-script.js" defer></script>

    <title>Fooble Countdown Widget</title>

    <style>
      /* DEFAULTS */
      :root {
        --bg-color: #0f0f0f;
        --text-color: #ffffff;
        --accent-color: #1a1a1a;
        --primary-color: #ff6b35;
        --primary-hover: #e55a2b;
        --border-radius: 12px;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }

      /* OVERRIDE STYLES */
      body {
        margin: 0;
        background: linear-gradient(
          135deg,
          var(--bg-color) 0%,
          var(--accent-color) 100%
        );
        padding: 1rem;
        min-height: 100vh;
        color: var(--text-color);
      }

      .container {
        padding: 1.25rem;
        min-height: auto;
        gap: 1rem;
      }

      .countdown-name {
        margin-bottom: 0;
        color: var(--text-color);
        font-size: 2rem;
      }

      .countdown-display {
        gap: 0.75rem;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .time-unit {
        padding: 1.1rem 0.75rem;
        min-height: 120px;
      }

      .time-value {
        color: var(--text-color);
        font-size: 2.4rem;
        line-height: 1.1;
      }

      .time-label {
        font-size: 0.8rem;
        letter-spacing: 1px;
      }

      @media (max-width: 480px) {
        .countdown-display {
          grid-template-columns: 1fr;
        }
      }

      .finished-message h2 {
        font-size: 2rem;
      }
    </style>
  </head>
  <body>
    <!-- MAIN CONTAINER -->
    <div class="container">
      <!-- NAME -->
      <h1 class="countdown-name" id="countdownName">Countdown</h1>

      <!-- COUNTDOWN DISPLAY -->
      <div class="countdown-display" id="countdownDisplay">
        <div class="time-unit">
          <span class="time-value" id="days">00</span>
          <span class="time-label" id="daysLabel" data-singular="Day" data-plural="Days">Days</span>
        </div>
        <div class="time-unit">
          <span class="time-value" id="hours">00</span>
          <span class="time-label" id="hoursLabel" data-singular="Hour" data-plural="Hours">Hours</span>
        </div>
        <div class="time-unit">
          <span class="time-value" id="minutes">00</span>
          <span class="time-label" id="minutesLabel" data-singular="Minute" data-plural="Minutes">Minutes</span>
        </div>
        <div class="time-unit">
          <span class="time-value" id="seconds">00</span>
          <span class="time-label" id="secondsLabel" data-singular="Second" data-plural="Seconds">Seconds</span>
        </div>
      </div>

      <!-- FINISHED MESSAGE -->
      <div class="finished-message" id="finishedMessage" style="display: none">
        <h2>🎉 Time's Up! 🎉</h2>
      </div>
    </div>
  </body>
</html>
